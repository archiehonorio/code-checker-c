<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>code-checker-c</title>
<style>
:root {
  --bg:      #0b1220;   /* original navy */
  --panel:   #0a1830;
  --border:  rgba(255,255,255,0.08);
  --text:    #e6eef6;
  --muted:   #a9b6c8;   /* readable secondary text */
  --faint:   #6f7d92;   /* line numbers */
  --accent:  #7dd3fc;   /* cyan — original accent, used flat */
  --accent-soft: rgba(125,211,252,0.12);

  --err:   #ff7b72;
  --warn:  #f0c55e;
  --info:  #7dd3fc;     /* suggestions */
  --ok:    #66e07f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
header .title { font-size: 14px; color: var(--text); letter-spacing: 0.3px; }
header .title b { color: var(--accent); font-weight: 600; }
header .subtitle { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* ── Layout ── */
.app {
  display: grid;
  grid-template-columns: 440px 1fr;
  flex: 1;
  gap: 14px;
  padding: 14px;
  min-height: 0;
  overflow: hidden;
}

/* ── Panels ── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.panel-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.2px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.right { display: flex; flex-direction: column; }

/* ── Editor ── */
.editor-wrap { flex: 1; display: flex; flex-direction: column; padding: 12px; min-height: 0; }
textarea {
  flex: 1; resize: none; width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: #081326;
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  line-height: 1.6;
  outline: none;
  transition: border-color 0.15s ease;
}
textarea::placeholder { color: var(--faint); }
textarea:focus { border-color: var(--accent); }

.btn-row { display: flex; gap: 8px; margin-top: 12px; flex-shrink: 0; }
button { font-family: inherit; cursor: pointer; font-size: 12px; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.btn-run {
  padding: 8px 18px; border: none; border-radius: 5px;
  background: var(--accent); color: #052233; font-weight: 600;
}
.btn-run:hover { background: #9adcfd; }
.btn-clear {
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 5px;
  background: transparent; color: var(--muted);
}
.btn-clear:hover { color: var(--text); border-color: var(--muted); }
button:focus-visible, .flt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Verdict (plain text, no pills) ── */
#verdict-bar { padding: 12px 14px; display: none; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.verdict { font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; }
.verdict-safe    { color: var(--ok); }
.verdict-caution { color: var(--warn); }
.verdict-risky   { color: var(--err); }
.counts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.count-badge { font-size: 11px; color: var(--muted); }
.count-err  { color: var(--err); }
.count-warn { color: var(--warn); }
.count-info { color: var(--info); }
.count-ok   { color: var(--ok); }

/* ── Filters (text toggles, underline on active) ── */
#filter-bar { padding: 8px 14px; display: none; gap: 16px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.flt {
  padding: 2px 0; border: none; background: transparent;
  font-size: 11px; color: var(--muted);
  border-bottom: 1px solid transparent;
}
.flt:hover { color: var(--text); }
.flt.active-all  { color: var(--text);   border-bottom-color: var(--accent); }
.flt.active-err  { color: var(--err);    border-bottom-color: var(--err); }
.flt.active-warn { color: var(--warn);   border-bottom-color: var(--warn); }
.flt.active-info { color: var(--info);   border-bottom-color: var(--info); }

/* ── Results area ── */
.results-grid { flex: 1; display: grid; grid-template-rows: 1fr 1fr; min-height: 0; overflow: hidden; }

/* ── Code preview ── */
.preview-wrap { border-bottom: 1px solid var(--border); overflow: auto; padding: 10px 12px; }
.preview { font-family: inherit; font-size: 12.5px; white-space: pre; }
.line { display: block; padding: 1px 4px; border-left: 2px solid transparent; }
.ln { display: inline-block; width: 38px; color: var(--faint); user-select: none; }
.highlight { background: var(--accent-soft); border-left-color: var(--accent); }

/* ── Issue ledger (hairline rows, thin severity rule, no fills) ── */
.issues-wrap { overflow: auto; padding: 4px 0; }
.issue {
  border-left: 2px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 11px 14px;
  margin: 0;
}
.issue:last-child { border-bottom: none; }
.issue.sev-error      { border-left-color: var(--err); }
.issue.sev-warning    { border-left-color: var(--warn); }
.issue.sev-suggestion { border-left-color: var(--info); }
.issue.sev-ok         { border-left-color: var(--ok); }

.issue-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.issue-badge { font-size: 10px; letter-spacing: 0.5px; flex-shrink: 0; }
.badge-error      { color: var(--err); }
.badge-warning    { color: var(--warn); }
.badge-suggestion { color: var(--info); }
.issue-rule { font-size: 11px; color: var(--faint); flex-shrink: 0; }
.issue-type { font-size: 12.5px; color: var(--text); }
.issue-meta { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
.issue-snippet {
  font-family: inherit; font-size: 11.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.issue-detail { font-size: 12px; color: #cdd6e2; margin-top: 5px; line-height: 1.55; }
.btn-goto {
  margin-top: 7px; padding: 3px 10px; font-size: 11px; border-radius: 4px;
  background: transparent; color: var(--muted); border: 1px solid var(--border);
}
.btn-goto:hover { color: var(--text); border-color: var(--muted); }
.issue-fix { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.issue-fix code {
  font-family: inherit; font-size: 11px; color: var(--accent);
  background: var(--accent-soft); border: 1px solid var(--border); border-radius: 4px;
  padding: 3px 7px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-copy-fix {
  padding: 3px 9px; font-size: 10px; border-radius: 4px;
  background: transparent; color: var(--muted); border: 1px solid var(--border);
}
.btn-copy-fix:hover { color: var(--accent); border-color: var(--accent); }

/* ── Punctuation: same readable colour as the code, no rainbow ── */
.brace, .paren, .bracket { color: var(--text); }

/* ── Scrollbars ── */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #1d2a3e; border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── Responsive ── */
@media (max-width: 860px) {
  body { height: auto; overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .panel { min-height: 340px; }
  .results-grid { grid-template-rows: 260px 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="title"><b>code-checker-c</b></div>
  <div class="subtitle">C++ static analysis · runs locally, no dependencies</div>
</header>

<div class="app">

  <!-- Left: editor -->
  <div class="panel">
    <div class="panel-header"><span>editor</span></div>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false" placeholder="// paste your .cpp here, then Run"></textarea>
      <div class="btn-row">
        <button id="run" class="btn-run">Run</button>
        <button id="clear" class="btn-clear">Clear</button>
      </div>
    </div>
  </div>

  <!-- Right: results -->
  <div class="panel right">
    <div class="panel-header">
      <span>results</span>
      <span id="issue-count" style="color:var(--muted);font-size:11px;"></span>
    </div>

    <div id="verdict-bar"></div>

    <div id="filter-bar">
      <button class="flt active-all" data-filter="all">All</button>
      <button class="flt" data-filter="error">Errors</button>
      <button class="flt" data-filter="warning">Warnings</button>
      <button class="flt" data-filter="suggestion">Suggestions</button>
    </div>

    <div class="results-grid">
      <div class="preview-wrap">
        <div id="preview" class="preview"></div>
      </div>
      <div class="issues-wrap">
        <div id="issues"></div>
      </div>
    </div>
  </div>

</div>

<script src="core.js"></script>
<!-- shared structural pass — must load before the validators that use it -->
<script src="validators/cpp_scope.js"></script>
<!-- validators -->
<script src="validators/validate_memory.js"></script>
<script src="validators/validate_array.js"></script>
<script src="validators/validate_loop.js"></script>
<script src="validators/validate_addinloop.js"></script>
<script src="validators/validate_sql.js"></script>
<script src="validators/validate_raise.js"></script>
<script src="validators/validate_multiple_raise.js"></script>
<script src="validators/validate_tempdb.js"></script>
<script src="validators/validate_divzero.js"></script>
<script src="validators/validate_oldutils.js"></script>
<script src="validators/validate_deletefile.js"></script>
<script src="validators/validate_cout.js"></script>
<script src="validators/validate_string_empty.js"></script>
<script src="validators/validate_string_append.js"></script>
<script src="validators/validate_return_type.js"></script>
<script src="validators/validate_executenonquery.js"></script>
<script src="validators/validate_strstr.js"></script>
<script src="validators/validate_constructor.js"></script>
<script src="validators/validate_select_star.js"></script>
<script src="validators/validate_struct.js"></script>
<script src="validators/validate_setfill.js"></script>
<script src="validators/validate_tempfile.js"></script>
</body>
</html>
